[project]
name = "blackstar-ai"
version = "1.0.0"
description = "BLACKSTAR-AI LLM API - A FastAPI service for authenticated LLM access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.27.2",
    "requests>=2.32.3",
    "pydantic>=2.10.3",
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["auth", "db", "llm", "main.py"]

[tool.uv]
dev-dependencies = []